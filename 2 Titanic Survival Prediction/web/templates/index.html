<!doctype html>
<html>
  <head>
    <title>Titanic Survival Predictor</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <h1>Titanic Survival Prediction</h1>
      <form method="POST">
        <input
          type="number"
          name="pclass"
          placeholder="Pclass (1=1st, 2=2nd, 3=3rd)"
          required
        />
        <input
          type="number"
          name="sex"
          placeholder="Sex (0=Male, 1=Female)"
          required
        />
        <input
          type="number"
          step="0.1"
          name="age"
          placeholder="Age (e.g., 25)"
          required
        />
        <input
          type="number"
          name="sibsp"
          placeholder="Siblings/Spouses aboard"
          required
        />
        <input
          type="number"
          name="parch"
          placeholder="Parents/Children aboard"
          required
        />
        <input
          type="number"
          step="0.1"
          name="fare"
          placeholder="Fare (e.g., 7.25)"
          required
        />
        <button type="submit">Predict</button>
      </form>
      {% if prediction %}
      <h2 style="color: green">Prediction: {{ prediction }}</h2>
      {% endif %}
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  </body>
</html>
