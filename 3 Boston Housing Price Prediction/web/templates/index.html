<!doctype html>
<html>
  <head>
    <title>Boston Housing Predictor</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <h1>Boston Housing Price Prediction</h1>
      <form method="POST">
        <div class="form-grid">
          <input
            type="number"
            step="0.1"
            name="crim"
            placeholder="Crime Rate (CRIM)"
            required
          />
          <input
            type="number"
            step="0.1"
            name="zn"
            placeholder="Residential Zone (ZN)"
            required
          />
          <input
            type="number"
            step="0.1"
            name="indus"
            placeholder="Industrial Area (INDUS)"
            required
          />
          <input
            type="number"
            step="1"
            name="chas"
            placeholder="Charles River (0/1)"
            required
          />
          <input
            type="number"
            step="0.01"
            name="nox"
            placeholder="Nitric Oxides (NOX)"
            required
          />
          <input
            type="number"
            step="0.1"
            name="rm"
            placeholder="Avg Rooms (RM)"
            required
          />
          <input
            type="number"
            step="0.1"
            name="age"
            placeholder="Age of Property (AGE)"
            required
          />
          <input
            type="number"
            step="0.1"
            name="dis"
            placeholder="Distance to Centers (DIS)"
            required
          />
          <input
            type="number"
            step="1"
            name="rad"
            placeholder="Highway Accessibility (RAD)"
            required
          />
          <input
            type="number"
            step="1"
            name="tax"
            placeholder="Property Tax Rate (TAX)"
            required
          />
          <input
            type="number"
            step="0.1"
            name="ptratio"
            placeholder="Pupil-Teacher Ratio (PTRATIO)"
            required
          />
          <input
            type="number"
            step="0.1"
            name="b"
            placeholder="Black Population Proportion (B)"
            required
          />
          <input
            type="number"
            step="0.1"
            name="lstat"
            placeholder="Lower Status Population (LSTAT)"
            required
          />
        </div>
        <button type="submit" style="margin-top: 20px">Predict Price</button>
      </form>
      {% if prediction %}
      <h2 style="color: green; margin-top: 20px">
        Predicted Price: {{ prediction }}
      </h2>
      {% endif %}
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  </body>
</html>
