<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Boston Housing: ML Pipeline Defense</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg: #f4f7ff;
            --card: rgba(255, 255, 255, .95);
            --tx: #0f172a;
            --mu: #475569;
            --bd: rgba(15, 23, 42, .10);
            --fm: #f1f5ff;
            --sh: rgba(30, 41, 90, .28);
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        :root[data-theme=dark] {
            --bg: #0b1020;
            --card: rgba(20, 27, 50, .94);
            --tx: #f1f5f9;
            --mu: #a9b6cc;
            --bd: rgba(255, 255, 255, .12);
            --fm: rgba(255, 255, 255, .06);
            --sh: rgba(0, 0, 0, .6)
        }

        * {
            box-sizing: border-box;
            margin: 0
        }

        html,
        body {
            height: 100%;
            color: var(--tx);
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
            overflow: hidden
        }

        body {
            background: radial-gradient(1200px 700px at 15% 10%, rgba(99, 102, 241, .18), transparent 60%), radial-gradient(1000px 700px at 90% 90%, rgba(236, 72, 153, .14), transparent 60%), var(--bg)
        }

        #bg {
            position: fixed;
            inset: 0;
            z-index: 0
        }

        #app {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: .9rem 1.6rem
        }

        #steps {
            display: flex;
            gap: .35rem;
            flex-wrap: wrap;
            justify-content: center
        }

        .st {
            font-size: clamp(9px, .9vw, 13px);
            font-weight: 600;
            padding: .28rem .7rem;
            border-radius: 99px;
            background: var(--card);
            border: 1px solid var(--bd);
            color: var(--mu);
            transition: .4s
        }

        .st.on {
            color: #fff;
            background: var(--c);
            border-color: var(--c);
            box-shadow: 0 8px 22px -6px var(--c);
            transform: translateY(-3px) scale(1.08)
        }

        #stage {
            flex: 1;
            position: relative;
            perspective: 1600px;
            margin: .8rem 0
        }

        .sl {
            position: absolute;
            inset: 0;
            display: flex;
            opacity: 0;
            pointer-events: none;
            transform: translateZ(-600px) rotateY(50deg);
            transition: all .9s cubic-bezier(.2, .8, .2, 1);
            transform-style: preserve-3d
        }

        .sl.on {
            opacity: 1;
            pointer-events: auto;
            transform: none
        }

        .sl.pv {
            transform: translateZ(-600px) rotateY(-50deg)
        }

        .cd {
            margin: auto;
            width: min(1180px, 100%);
            max-height: 100%;
            overflow: auto;
            background: var(--card);
            backdrop-filter: blur(18px);
            border: 1px solid var(--bd);
            border-top: 7px solid var(--c);
            border-radius: 28px;
            padding: clamp(1rem, 2.4vw, 2.2rem);
            box-shadow: 0 45px 90px -35px var(--sh), 0 0 0 1px rgba(255, 255, 255, .4) inset;
            font-size: clamp(14px, 1.5vw, 21px);
            line-height: 1.55;
            transition: transform .25s
        }

        .tg {
            display: inline-block;
            font-size: .58em;
            font-weight: 700;
            letter-spacing: .09em;
            text-transform: uppercase;
            color: #fff;
            background: var(--c);
            padding: .25rem .8rem;
            border-radius: 99px;
            margin-bottom: .7rem
        }

        h2 {
            font-size: 1.85em;
            line-height: 1.15;
            margin-bottom: 1.1rem;
            font-weight: 800;
            letter-spacing: -.01em
        }

        h2:after {
            content: "";
            display: block;
            width: 72px;
            height: 5px;
            border-radius: 9px;
            background: var(--c);
            margin-top: .5rem
        }

        .gr {
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            gap: 1.6rem
        }

        @media(max-width:800px) {
            .gr {
                grid-template-columns: 1fr
            }
        }

        ul {
            list-style: none;
            padding: 0;
            counter-reset: n
        }

        li {
            padding: .5rem 0 .5rem 2.2rem;
            position: relative;
            counter-increment: n
        }

        li:before {
            content: counter(n);
            position: absolute;
            left: 0;
            top: .55em;
            width: 1.5em;
            height: 1.5em;
            border-radius: 50%;
            background: var(--c);
            color: #fff;
            font-size: .72em;
            font-weight: 700;
            display: grid;
            place-items: center
        }

        .fm {
            font-family: Cambria, "Times New Roman", serif;
            font-size: 1.1em;
            background: var(--fm);
            border: 1px solid var(--bd);
            border-left: 5px solid var(--c);
            border-radius: 14px;
            padding: .7rem 1rem;
            margin-bottom: .65rem;
            animation: up .6s both
        }

        .fm i {
            font-style: italic
        }

        .sy {
            margin-top: 1rem;
            padding: .8rem 1.1rem;
            border-radius: 16px;
            background: color-mix(in srgb, var(--c) 12%, transparent);
            border-left: 6px solid var(--c);
            color: var(--tx);
            font-size: .92em
        }

        .sy b {
            color: var(--c)
        }

        .pp {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: .8rem;
            margin: .8rem 0;
            perspective: 900px
        }

        .nd {
            padding: .8rem;
            border-radius: 18px;
            background: var(--card);
            border: 1px solid var(--bd);
            border-bottom: 5px solid var(--c);
            box-shadow: 0 14px 30px -18px var(--sh);
            transform: rotateX(14deg);
            animation: pl 6s infinite both;
            animation-delay: calc(var(--i)*.5s)
        }

        .nd b {
            display: block;
            color: var(--c)
        }

        .nd span {
            font-size: .8em;
            color: var(--mu)
        }

        @keyframes pl {

            0%,
            18%,
            100% {
                transform: rotateX(14deg)
            }

            6% {
                transform: rotateX(0) translateZ(50px) scale(1.07);
                box-shadow: 0 26px 40px -14px var(--c)
            }
        }

        @keyframes up {
            from {
                opacity: 0;
                transform: translateY(16px)
            }
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-bottom: .6rem;
            font-size: .85em;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--bd)
        }

        th {
            background: var(--c);
            color: #fff
        }

        th,
        td {
            padding: .55rem;
            border-bottom: 1px solid var(--bd);
            text-align: center
        }

        pre {
            background: #1e293b;
            color: #e2e8f0;
            border-radius: 14px;
            padding: 1rem;
            font-size: .62em;
            overflow: auto;
            line-height: 1.5
        }

        .bar {
            display: flex;
            height: 2.6rem;
            border-radius: 14px;
            overflow: hidden;
            margin: .7rem 0;
            font-size: .7em;
            font-weight: 700;
            color: #fff
        }

        .bar div {
            display: grid;
            place-items: center;
            transform-origin: left;
            animation: gw 1.2s both
        }

        @keyframes gw {
            from {
                transform: scaleX(0)
            }
        }

        #ft {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--mu);
            font-size: .9rem;
            font-weight: 600
        }

        button {
            background: var(--card);
            color: var(--tx);
            border: 1px solid var(--bd);
            border-radius: 12px;
            padding: .5rem 1.1rem;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            box-shadow: 0 8px 18px -12px var(--sh)
        }

        button:hover {
            background: var(--c, #6366f1);
            color: #fff
        }

        .big {
            font-size: 1.25em
        }

        .ttl h2 {
            font-size: 2.9em
        }
    </style>
</head>

<body><canvas id="bg"></canvas>
    <div id="app">
        <div id="steps"></div>
        <div id="stage"></div>
        <div id="ft"><button id="pv">← Prev</button><span id="ct"></span><button id="th">◐ Theme</button><button
                id="nx">Next →</button></div>
    </div>
    <script>
        const D = { "stages": ["Problem", "Data", "Explore", "Clean", "Features", "Split", "Scale", "Train", "Validate", "Test", "Deploy"], "slides": [{ "k": "title", "st": 0, "sp": "Both", "t": "Boston Housing Price Prediction", "plain": ["End-to-end Machine Learning pipeline", "M.Tech AI · CAI504C Machine Learning Lab · IUST Kashmir", "Speaker 1: Data Engineering · Speaker 2: Modeling & Deployment", "Techniques: Simple Linear Regression · Multiple Linear Regression (OLS) · Linear SVR"], "math": [], "say": "Press → to start. First we explain the problem, then every pipeline step with its maths.", "c": "#f43f5e", "n": 1 }, { "st": 0, "sp": "Speaker 1", "t": "The Problem: What is a house worth?", "plain": ["A bank must decide how big a loan to give for a house.", "Predict too <b>high</b> → bank lends too much, buyer defaults, bank loses money.", "Predict too <b>low</b> → a good loan is rejected, bank loses a customer.", "So we need a model whose price is as close to the truth as possible."], "math": ["Input: <i>x</i> = [<i>x</i><sub>1</sub>, …, <i>x</i><sub>13</sub>]  (13 facts about a neighbourhood)", "Output: <i>y</i> = MEDV  (median price, in $1,000s)", "Model: ŷ = <i>w</i><sub>0</sub> + <i>w</i><sub>1</sub><i>x</i><sub>1</sub> + … + <i>w</i><sub>13</sub><i>x</i><sub>13</sub>", "Goal: choose <i>w</i> to make mean squared error (MSE) small"], "say": "Type of problem: <b>Supervised Regression</b>. Supervised = we know the true prices. Regression = the answer is a number.", "c": "#f43f5e", "n": 2 }, { "k": "pipe", "st": 0, "sp": "Speaker 1", "t": "The ML Pipeline: our roadmap", "plain": ["A pipeline is a fixed chain of steps. Each step feeds the next.", "Data flows left to right, then rows below. Nothing is skipped.", "<b>Three techniques:</b> Simple Linear Regression (1 feature), Multiple Linear Regression / OLS (13 features), Linear SVR (13 features, tolerance tube)."], "math": [], "say": "Every following slide shows this stage name at the top, so the audience always knows where we are.", "c": "#f43f5e", "n": 3 }, { "st": 1, "sp": "Speaker 1", "t": "Step 1: Raw Data", "plain": ["Source: Harrison &amp; Rubinfeld (1978), 506 census tracts of Boston.", "Target <b>MEDV</b>: median home value in $1,000s (1970 dollars).", "Home: RM, AGE, CHAS, ZN, INDUS. Place: NOX, DIS, RAD, TAX, CRIM. People: PTRATIO, B, LSTAT.", "Raw file is <b>read-only</b>. We check shape (506, 14) and zero nulls, then save clean_boston.csv."], "math": ["Dataset size: <i>N</i> = 506,  features <i>p</i> = 13", "B = 1000(<i>Bk</i> − 0.63)²"], "say": "Why read-only? So the original evidence can never be damaged by our code.", "c": "#38bdf8", "n": 4 }, { "st": 2, "sp": "Speaker 1", "t": "Step 2: Explore the Data (EDA)", "plain": ["Price: mean $22.53k, median $21.2k, min $5k, max $50k.", "Exactly <b>16 tracts</b> sit at $50k. The survey capped prices there (censoring).", "A line cannot bend at the cap, so very expensive homes get under-predicted.", "Crime (CRIM) is very skewed: mean 3.61 but median 0.26."], "math": ["Mean (22.53) &gt; Median (21.2) → long tail on the right", "Std deviation of price = $9.20k"], "say": "EDA means: look first, model later. It tells us what problems to expect.", "c": "#a855f7", "n": 5 }, { "st": 2, "sp": "Speaker 1", "t": "Step 3: Correlation & the Multicollinearity Trap", "plain": ["RM (rooms) <b>+0.70</b>: more rooms → higher price.", "LSTAT (low-status %) <b>−0.74</b>: poorer area → lower price.", "PTRATIO <b>−0.51</b>: crowded schools → lower price.", "TAX and RAD have r = <b>+0.91</b>: they say almost the same thing, so OLS cannot decide who deserves the credit."], "math": ["Pearson: <i>r</i> = Σ(<i>x</i>−<i>x̄</i>)(<i>y</i>−<i>ȳ</i>) / √[Σ(<i>x</i>−<i>x̄</i>)² · Σ(<i>y</i>−<i>ȳ</i>)²]", "Var(ŵ) = σ² (<i>X</i><sup>T</sup><i>X</i>)<sup>−1</sup>  → explodes when <i>X</i><sup>T</sup><i>X</i> is near-singular"], "say": "Effect: individual weights for TAX and RAD become unstable, but total predictions stay fine. Ridge is outside our syllabus, so we detect and explain it.", "c": "#a855f7", "n": 6 }, { "st": 3, "sp": "Speaker 1", "t": "Step 4: Clean the Data", "plain": ["Null audit: 0 missing values in all 14 columns.", "Range checks catch impossible values before they reach the model.", "If any check fails the pipeline stops. Bad data never trains a model."], "math": ["RM ∈ [3.56, 8.78], so RM &gt; 0", "AGE ∈ [2.9, 100] ⊆ [0, 100]%", "CHAS ∈ {0, 1}  ·  MEDV ∈ [5, 50]"], "say": "Code: assert df.isnull().sum().sum() == 0", "c": "#10b981", "n": 7 }, { "st": 4, "sp": "Speaker 1", "t": "Step 5: Feature Engineering (Enrichment)", "plain": ["We create new features from old ones, so a linear model can see combined effects.", "<b>Room-to-Pupil ratio:</b> big homes in uncrowded school areas are worth more (r = +0.66).", "<b>Affluence index:</b> home size combined with neighbourhood wealth.", "Final scores in this deck use the 13 original features."], "math": ["ROOM_PUPIL_RATIO = RM / PTRATIO", "AFFLUENCE_INDEX = RM × 1 / (LSTAT + 0.1)"], "say": "The +0.1 avoids dividing by zero.", "c": "#f59e0b", "n": 8 }, { "k": "split", "st": 5, "sp": "Speaker 1", "t": "Step 6: Split 70% / 20% / 10%", "plain": ["<b>Train 354:</b> the model learns weights here.", "<b>Validation 101:</b> we compare settings (C, ε) here.", "<b>Test 51:</b> opened once, for the final honest score.", "Tuning on test data would leak information and give a fake-good score."], "math": ["Degrees of freedom = 354 − 13 − 1 = 340", "354 / 13 ≈ 27 rows per weight (rule of thumb: ≥ 10)"], "say": "Think of it like exam prep: textbook (train), mock test (validation), real exam (test).", "c": "#06b6d4", "n": 9 }, { "st": 6, "sp": "Speaker 1", "t": "Step 7: Feature Scaling (StandardScaler)", "plain": ["TAX is 187 to 711 but NOX is 0.385 to 0.871. Scales differ hugely.", "SVR penalises big weights, so unscaled features get treated unfairly.", "<b>Zero-leakage law:</b> learn μ and σ from <b>train only</b>, then apply to validation and test."], "math": ["<i>z</i> = (<i>x</i> − μ<sub>train</sub>) / σ<sub>train</sub>", "SVR penalty: ½‖<i>w</i>‖² = ½ Σ <i>w</i><sub>j</sub>²"], "say": "fit_transform on train. transform only on val and test.", "c": "#ec4899", "n": 10 }, { "st": 7, "sp": "Speaker 2", "t": "Technique 1: Simple Linear Regression", "plain": ["One feature (RM) predicts price with a straight line.", "The best line makes the squared errors smallest.", "Result: RM alone explains 42.88% of price changes. It ignores crime, pollution and schools."], "math": ["ŷ = <i>w</i><sub>1</sub><i>x</i> + <i>w</i><sub>0</sub>", "<i>w</i><sub>1</sub> = Σ(<i>x</i>−<i>x̄</i>)(<i>y</i>−<i>ȳ</i>) / Σ(<i>x</i>−<i>x̄</i>)²", "<i>w</i><sub>0</sub> = <i>ȳ</i> − <i>w</i><sub>1</sub><i>x̄</i>", "R² = 0.4288 · MSE = 58.72"], "say": "This is our baseline. Any better model must beat it.", "c": "#8b5cf6", "n": 11 }, { "st": 7, "sp": "Speaker 2", "t": "Technique 2: Multiple Linear Regression (OLS)", "plain": ["Same idea, but all 13 features together.", "Cost = average squared error. Slope of the cost must be zero at the minimum.", "That gives one exact formula, the <b>Normal Equation</b>. No learning rate, no loops.", "Test: R² 0.7140, MSE 29.39, RMSE $5,421.71, MAE $3,390.46."], "math": ["<i>J</i>(<i>w</i>) = (1/2<i>N</i>) (<i>y</i> − <i>Xw</i>)<sup>T</sup>(<i>y</i> − <i>Xw</i>)", "∇<i>J</i> = (1/<i>N</i>)(−<i>X</i><sup>T</sup><i>y</i> + <i>X</i><sup>T</sup><i>Xw</i>) = 0", "<i>X</i><sup>T</sup><i>Xw</i> = <i>X</i><sup>T</sup><i>y</i>", "ŵ = (<i>X</i><sup>T</sup><i>X</i>)<sup>−1</sup><i>X</i><sup>T</sup><i>y</i>"], "say": "Why not Gradient Descent? With only 14 weights the exact answer is instant. Cost O(p³).", "c": "#8b5cf6", "n": 12 }, { "st": 7, "sp": "Speaker 2", "t": "Technique 3: Linear Support Vector Regression", "plain": ["OLS punishes every error. SVR ignores errors inside a tube of width ε.", "Outside the tube the penalty grows <b>linearly</b>, not squared. Outliers pull less.", "C = how strongly we punish points outside the tube. Kernel is linear only.", "Test: R² 0.6634, MSE 34.60, RMSE $5,882.40, MAE $3,485.10."], "math": ["Loss: <i>L</i><sub>ε</sub> = 0 if |<i>y</i>−ŷ| ≤ ε, else |<i>y</i>−ŷ| − ε", "min ½‖<i>w</i>‖² + <i>C</i> Σ(ξ<sub>i</sub> + ξ<sub>i</sub>*)", "subject to |<i>y</i><sub>i</sub> − (<i>w</i><sup>T</sup><i>x</i><sub>i</sub> + <i>b</i>)| ≤ ε + ξ", "<i>C</i> = 1.0 · ε = 0.2"], "say": "ξ (slack) = how far a point sits outside the tube.", "c": "#8b5cf6", "n": 13 }, { "st": 8, "sp": "Speaker 2", "t": "Step 8: 5-Fold Cross-Validation", "plain": ["Split train data into 5 parts. Train on 4, test on 1. Repeat 5 times.", "Folds R²: 0.7412, 0.6984, 0.6510, 0.7235, 0.6261.", "Mean 0.688 is close to the final test R² (0.714), so the test split was not just lucky.", "Learning curve: with more data, train and validation error meet. Bias and variance are balanced."], "math": ["Mean R² = (0.7412 + 0.6984 + 0.6510 + 0.7235 + 0.6261) / 5 = 0.688", "Std deviation ≈ 0.043"], "say": "CV tells us how stable the model is.", "c": "#22c55e", "n": 14 }, { "k": "table", "st": 9, "sp": "Speaker 2", "t": "Step 9: Final Test Results", "plain": ["Test set = 51 unseen tracts, used once.", "OLS wins: lowest error, highest R².", "R² 0.714 means 71.4% of price variation is explained. The other 28.6% is things we did not measure, such as views and renovations.", "Residuals average ≈ 0. Spread grows above $40k because of the $50k cap."], "math": ["R² = 1 − SS<sub>res</sub> / SS<sub>tot</sub>", "RMSE = √MSE"], "table": [["Model", "R²", "MSE", "RMSE", "MAE"], ["OLS (13 features)", "0.7140", "29.39", "$5,421.71", "$3,390.46"], ["Linear SVR", "0.6634", "34.60", "$5,882.40", "$3,485.10"], ["Simple LR (RM)", "0.4288", "58.72", "$7,662.68", "$5,112.30"]], "say": "Gauss-Markov: OLS is the best linear unbiased estimator when errors have zero mean, equal spread and no autocorrelation.", "c": "#f97316", "n": 15 }, { "k": "code", "st": 9, "sp": "Speaker 1", "t": "Code Walkthrough", "plain": ["Load, check shape and nulls.", "Split 70/30, then split the 30 into 20 and 10.", "Fit scaler on train only.", "Fit OLS, score on test, save model and scaler."], "math": [], "code": "df = pd.read_csv('data/raw/boston.csv')\nassert df.shape == (506, 14)\nassert df.isnull().sum().sum() == 0\nX, y = df.drop(columns=['MEDV']), df['MEDV']\nX_tr, X_tmp, y_tr, y_tmp = train_test_split(X, y, test_size=0.30, random_state=42)\nX_val, X_te, y_val, y_te = train_test_split(X_tmp, y_tmp, test_size=0.33333, random_state=42)\nsc = StandardScaler()\nX_tr_s = sc.fit_transform(X_tr)   # fit on train ONLY\nX_te_s = sc.transform(X_te)\nols = LinearRegression().fit(X_tr_s, y_tr)\nprint(r2_score(y_te, ols.predict(X_te_s)))\njoblib.dump(ols, 'models/boston_ols_model.joblib')", "say": "random_state=42 makes the split repeatable.", "c": "#f97316", "n": 16 }, { "st": 10, "sp": "Speaker 2", "t": "Step 10: Deployment (Flask API)", "plain": ["Flask web service on port 5002. Model and scaler load once into memory.", "Client sends 13 features as JSON to POST /predict and gets a price back.", "About 0.84 ms per request, 1,200+ predictions per second per worker.", "Inputs are checked first (RM &gt; 0, AGE in 0 to 100) so bad data cannot cause wild predictions."], "math": ["Request: {\"RM\": 6.421, \"LSTAT\": 9.14, … }", "Response: {\"predicted_price_dollars\": \"$25,420.00\"}"], "say": "Same scaler in training and production, or predictions will be wrong.", "c": "#3b82f6", "n": 17 }, { "st": 10, "sp": "Speaker 2", "t": "Step 11: Monitoring — Data Drift vs Concept Drift", "plain": ["<b>Data drift:</b> inputs change over time, for example new apartments lower RM. Fix: alert when inputs leave training range.", "<b>Concept drift:</b> the price of the same house changes, for example inflation. A $25k home of 1970 is $850k+ now. Fix: adjust prices with a housing price index, then retrain."], "math": ["Data drift: P(<i>x</i>) changes", "Concept drift: P(<i>y</i> | <i>x</i>) changes"], "say": "Models age. Monitoring is part of the pipeline, not an extra.", "c": "#3b82f6", "n": 18 }, { "k": "qa", "st": 10, "sp": "Both", "t": "Viva: Key Questions", "plain": ["<b>Why Normal Equation?</b> Exact answer in one step. Only 14 weights, so it is instant.", "<b>TAX and RAD at r = 0.91?</b> XᵀX nearly singular, variance explodes, weights unstable. Predictions stay stable.", "<b>Why no Ridge/Lasso?</b> Outside the syllabus. We show we understand the problem.", "<b>SVR vs OLS and outliers?</b> Linear penalty outside the tube, so less leverage than squared error.", "<b>Why scaling for SVR but not OLS?</b> OLS predictions do not change with column scaling. SVR penalty ½‖w‖² does.", "<b>Why a validation set?</b> To tune without touching test. Otherwise the test score is optimistic.", "<b>Softmax?</b> No. Softmax is for classes. Our target is a continuous number."], "math": [], "say": "Thank you. Questions?", "c": "#3b82f6", "n": 19 }], "pipe": [["1 Problem", "Predict house price (regression)"], ["2 Data", "506 tracts, 13 features"], ["3 Explore", "Plots, find the $50k cap"], ["4 Clean", "Check nulls and ranges"], ["5 Features", "Build ratio features"], ["6 Split", "70 / 20 / 10"], ["7 Scale", "Z-score, fit on train only"], ["8 Train", "Simple LR, OLS, Linear SVR"], ["9 Validate", "5-fold CV, tune C and ε"], ["10 Test", "R², RMSE, MAE, once"], ["11 Deploy", "Flask API + drift watch"]] }, S = D.slides, C = ["#f43f5e", "#38bdf8", "#a855f7", "#10b981", "#f59e0b", "#06b6d4", "#ec4899", "#8b5cf6", "#22c55e", "#f97316", "#3b82f6"];
